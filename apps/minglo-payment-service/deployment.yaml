apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true      # опционально, но хорошая практика
             runAsUser: 1000         # опционально
           ports:
             - containerPort: PORT_CONTAINER
           env:
             - name: PAYMENTS_SERVICE_TCP_PORT
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_SERVICE_TCP_PORT
             - name: PAYMENTS_DB_URL
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_DB_URL
             - name: PAYMENTS_STRIPE_SECRET_KEY
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_STRIPE_SECRET_KEY
             - name: PAYMENTS_STRIPE_PUBLIC_KEY
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_STRIPE_PUBLIC_KEY
             - name: PAYMENTS_STRIPE_WEBHOOK_SECRET
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_STRIPE_WEBHOOK_SECRET
             - name: PAYMENTS_FRONTEND_URL
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_FRONTEND_URL
             - name: PAYMENTS_THROTTLE_TTL
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_THROTTLE_TTL
             - name: PAYMENTS_THROTTLE_LIMIT
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_THROTTLE_LIMIT
             - name: PAYMENTS_TESTING_MODULE
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_TESTING_MODULE
             - name: PAYMENTS_SWAGGER
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_SWAGGER
             - name: RABBITMQ_URL
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: RABBITMQ_URL
             - name: LOGGER_HOST
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: LOGGER_HOST
             - name: LOGGER_URL_PATH
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: LOGGER_URL_PATH
             - name: LOGGER_LEVEL
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: LOGGER_LEVEL
             - name: LOGGER_LICENSE_KEY
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: LOGGER_LICENSE_KEY
             - name: PAYMENTS_SERVICE_HOST
               valueFrom:
                 secretKeyRef:
                   name: minglo-payment-service-production-config-secret
                   key: PAYMENTS_SERVICE_HOST
