apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true      # опционально, но хорошая практика
             runAsUser: 1000         # опционально
           ports:
             - containerPort: PORT_CONTAINER
           env:
             - name: MESSENGER_DB_URL
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: MESSENGER_DB_URL
             - name: MINGLO_BLOG_URL
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: MINGLO_BLOG_URL
             - name: MESSENGER_TESTING_MODULE
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: MESSENGER_TESTING_MODULE
             - name: MESSENGER_SWAGGER
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: MESSENGER_SWAGGER
             - name: RABBITMQ_URL
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: RABBITMQ_URL
             - name: MESSENGER_THROTTLE_TTL
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: MESSENGER_THROTTLE_TTL
             - name: MESSENGER_THROTTLE_LIMIT
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: MESSENGER_THROTTLE_LIMIT
             - name: ACCESS_SECRET
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: ACCESS_SECRET
             - name: MINGLO_CORS
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: MINGLO_CORS
             - name: MINGLO_CORS_ORIGINS
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: MINGLO_CORS_ORIGINS
             - name: MINGLO_CORS_CREDENTIALS
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: MINGLO_CORS_CREDENTIALS
             - name: LOGGER_HOST
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: LOGGER_HOST
             - name: LOGGER_URL_PATH
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: LOGGER_URL_PATH
             - name: LOGGER_LEVEL
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: LOGGER_LEVEL
             - name: LOGGER_LICENSE_KEY
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: LOGGER_LICENSE_KEY
             - name: MESSENGER_PORT
               valueFrom:
                 secretKeyRef:
                   name: minglo-messenger-service-production-config-secret
                   key: MESSENGER_PORT
